<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 900" width="1700" height="900" role="img" aria-labelledby="dg-t-lore-ecosystem dg-d-lore-ecosystem">
<title id="dg-t-lore-ecosystem">Lore Ecosystem の構成 — Web と Qt クライアントが同じ Rust API を使う</title>
<desc id="dg-d-lore-ecosystem">ブラウザは Next.js(Vercel)経由、LoreForge Client と Server Admin は直接、Rust(Axum)の lorehub-api に接続する。API は SQLite とコンテンツアドレス方式の blob ストアを持つ。</desc>
