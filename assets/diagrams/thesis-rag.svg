<title id="dg-t-thesis-rag">卒業研究の全体構成 — RAG を用いた動的チュートリアル生成</title>
<desc id="dg-d-thesis-rag">Houdini の公式ドキュメントを Cloudflare Worker に索引し、Houdini パネルが検索と Claude を使ってチュートリアルを作り、RAGReel が台本・ナレーション・動画に変換してギャラリーに載せる。</desc>
